services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shgat
      POSTGRES_USER: shgat
      POSTGRES_PASSWORD: shgat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shgat"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://shgat:shgat@db:5432/shgat
      DEBUG: "0"
      SECRET_KEY: docker-dev-secret
      MEDIA_ROOT: /data/media
      ARCGIS_LAYER_URL: https://sampleserver6.arcgisonline.com/arcgis/rest/services/Wildfire/FeatureServer/2
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
